<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8e6e6">
<title>Premium Academy · Proposta 3 · App</title>
<link rel="icon" href="../assets/img/mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/core.css">
<style>
:root{
  --paper:#e8e6e6; --tile:#fff; --ink:#1c1819; --graph:#242021; --red:#d70e20; --mute:#7a7374; --line:#dcd8d8;
  --pa-bg:#fff; --pa-surface:#f1efef; --pa-fg:#1c1819; --pa-muted:#7a7374; --pa-line:#e3dfdf;
  --pa-radius:28px; --pa-display:'Bricolage Grotesque',sans-serif; --pa-body:'Bricolage Grotesque',sans-serif; --pa-display-style:normal; --pa-display-weight:800;
  --pa-map-land:#e8e6e6;
  --r:26px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 'Bricolage Grotesque',system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-variation-settings:'opsz' 16}
a{color:inherit}
button{font-family:inherit}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100dvh}

/* sidebar */
.side{position:sticky;top:0;height:100dvh;padding:22px 16px;display:flex;flex-direction:column;gap:6px}
.side .logo{display:block;padding:8px 10px 26px}
.side .logo img{width:150px}
.tab{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;border-radius:16px;border:0;background:none;color:var(--mute);font-size:16px;font-weight:600;cursor:pointer;text-align:left}
.tab svg{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8}
.tab:hover{color:var(--ink);background:rgba(0,0,0,.04)}
.tab[aria-current="page"]{background:var(--ink);color:#fff}
.side .bottom{margin-top:auto;display:grid;gap:10px}
.side .help{background:var(--tile);border-radius:20px;padding:16px;font-size:14px}
.side .help b{display:block;font-size:15px}
.back{font-size:13px;color:var(--mute);text-decoration:none;padding:6px 10px}

main{padding:22px 22px 40px 0;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}
.top h1{margin:0;font-size:clamp(28px,3.2vw,40px);font-weight:800;letter-spacing:-.03em;font-variation-settings:'opsz' 96,'wdth' 85}
.top .search{flex:1;max-width:420px;position:relative}
.top .search input{width:100%;padding:14px 18px 14px 46px;border-radius:999px;border:0;background:var(--tile);font:500 15px 'Bricolage Grotesque';color:var(--ink)}
.top .search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:18px;stroke:var(--mute);fill:none;stroke-width:2}
.me{display:flex;align-items:center;gap:10px;background:var(--tile);border:0;padding:6px 14px 6px 6px;border-radius:999px;cursor:pointer;font-weight:600}
.me i{width:34px;height:34px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:800}

.view{display:none}
.view.is-on{display:block;animation:vin .35s cubic-bezier(.2,.8,.2,1)}
@keyframes vin{from{opacity:0;transform:translateY(8px)}}

/* bento */
.bento{display:grid;grid-template-columns:repeat(12,1fr);grid-auto-rows:minmax(118px,auto);gap:14px}
.t{background:var(--tile);border-radius:var(--r);padding:22px;position:relative;overflow:hidden;min-width:0}
.t h2{margin:0;font-size:15px;font-weight:600;color:var(--mute)}
.t.dark{background:var(--graph);color:#fff}
.t.dark h2{color:#b7b0b1}
.t.red{background:var(--red);color:#fff}
.t.red h2{color:rgba(255,255,255,.8)}
.t.link{cursor:pointer;transition:transform .2s}
.t.link:hover{transform:translateY(-3px)}
.span-7{grid-column:span 7}.span-5{grid-column:span 5}.span-4{grid-column:span 4}.span-3{grid-column:span 3}.span-8{grid-column:span 8}.span-6{grid-column:span 6}
.row-2{grid-row:span 2}.row-3{grid-row:span 3}

.hero-t{display:flex;flex-direction:column;justify-content:space-between;min-height:390px}
.hero-t .city{font-size:clamp(56px,7.4vw,118px);font-weight:800;line-height:.85;letter-spacing:-.05em;font-variation-settings:'opsz' 96,'wdth' 75;margin:18px 0 6px}
.hero-t .sub{font-size:18px;opacity:.9}
.hero-t .mark{position:absolute;right:-40px;top:-10px;width:62%;opacity:.14;filter:brightness(0)}
.cd{display:flex;gap:8px;margin:20px 0}
.cd div{background:rgba(0,0,0,.18);border-radius:16px;padding:10px 12px;min-width:66px;font-size:12px}
.cd b{display:block;font-size:28px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;font-variation-settings:'wdth' 75}
.hero-t .act{display:flex;gap:10px;flex-wrap:wrap}
.hero-t .pa-btn{background:#fff;color:var(--red);border-color:#fff}
.hero-t .pa-btn.is-ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}

.gauge{display:grid;place-items:center;height:100%;padding-top:6px}
.gauge svg{width:100%;max-width:220px}
.gauge .v{font-size:44px;font-weight:800;fill:var(--ink);font-variation-settings:'wdth' 75}
.gauge p{margin:4px 0 0;text-align:center;color:var(--mute);font-size:14px}
.gauge-h .gauge{grid-template-columns:130px 1fr;justify-items:start;gap:16px;align-items:center}.gauge-h .gauge p{text-align:left;font-size:16px;color:var(--ink)}
@media (max-width:860px){.gauge-h .gauge{grid-template-columns:1fr;justify-items:center}.gauge-h .gauge p{text-align:center}}

.photo-t{padding:0;min-height:260px;background:#2b2728}
.photo-t img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;position:absolute;inset:0}
.photo-t .cap{position:absolute;left:14px;right:14px;bottom:14px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-radius:18px;padding:12px 14px;color:var(--ink)}
.photo-t .cap b{display:block}
.photo-t .cap span{font-size:13px;color:var(--mute)}

.cats{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.cats button{border:1px solid var(--line);background:none;padding:10px 14px;border-radius:14px;font-size:14px;font-weight:600;cursor:pointer;text-align:left;line-height:1.2}
.cats button small{display:block;font-weight:400;color:var(--mute);font-size:12px}
.cats button:hover{border-color:var(--ink)}

.mini-map{height:100%;display:grid;grid-template-rows:auto 1fr}
.mini-map .pa-map{max-height:300px;margin:auto}
.pa-pin-label{font-size:12px}

.mine .row{display:flex;align-items:center;gap:12px;margin-top:14px}
.mine .pa-qr{border-radius:10px;flex:none}
.mine .row b{display:block;font-size:18px}
.mine .row span{color:#b7b0b1;font-size:14px}

.big-num{font-size:64px;font-weight:800;line-height:1;letter-spacing:-.04em;font-variation-settings:'wdth' 75;margin-top:10px}
.quote-t p{font-size:19px;line-height:1.35;margin:12px 0 14px;font-weight:500}
.quote-t small{color:var(--mute)}
.steps-t ol{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:10px;counter-reset:s}
.steps-t li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start}
.steps-t li::before{content:counter(s);width:30px;height:30px;border-radius:10px;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px}
.steps-t li b{display:block}
.steps-t li span{color:#b7b0b1;font-size:14px}
.news-t form{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.news-t input{flex:1 1 180px;border:0;border-radius:999px;padding:13px 16px;font:500 15px 'Bricolage Grotesque';background:var(--paper)}
.blog-t a{display:block;text-decoration:none;padding:12px 0;border-bottom:1px solid var(--line)}
.blog-t a:last-child{border:0}
.blog-t a b{display:block;font-weight:600;line-height:1.3}
.blog-t a small{color:var(--mute)}
.spons-t{display:flex;align-items:center;justify-content:space-around;flex-wrap:wrap;gap:12px}
.spons-t span{font-weight:800;color:#b3adae;font-size:18px;font-variation-settings:'wdth' 75}

@media (max-width:1180px){
  .span-7,.span-8{grid-column:span 12}.span-5,.span-4,.span-6{grid-column:span 6}.span-3{grid-column:span 6}
  .row-3{grid-row:span 2}
}

/* vista tappe */
.filterbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filterbar select{border:0;background:var(--tile);border-radius:999px;padding:12px 16px;font:600 14px 'Bricolage Grotesque';color:var(--ink)}
.seg{display:inline-flex;background:var(--tile);border-radius:999px;padding:4px}
.seg button{border:0;background:none;padding:9px 16px;border-radius:999px;font-weight:600;cursor:pointer;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.ecard{display:flex;flex-direction:column;border:0;text-align:left;cursor:pointer;padding:0;color:inherit}
.ecard .head{display:flex;justify-content:space-between;align-items:flex-start;padding:20px 20px 0}
.ecard .datebox{background:var(--paper);border-radius:18px;padding:10px 12px;text-align:center;min-width:72px}
.ecard .datebox b{display:block;font-size:26px;font-weight:800;line-height:1;font-variation-settings:'wdth' 75}
.ecard .datebox small{font-size:12px;font-weight:700;color:var(--red)}
.ecard .body{padding:16px 20px 20px}
.ecard h3{margin:0;font-size:30px;font-weight:800;letter-spacing:-.03em;font-variation-settings:'wdth' 80}
.ecard p{margin:2px 0 14px;color:var(--mute);font-size:14px}
.ecard .slotsmini{display:flex;gap:4px;margin-bottom:10px}
.ecard .slotsmini i{flex:1;height:26px;border-radius:6px;background:var(--paper);position:relative;overflow:hidden}
.ecard .slotsmini i::after{content:'';position:absolute;left:0;bottom:0;right:0;height:var(--h);background:var(--red);opacity:.85}
.ecard .foot{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mute)}
.ecard .foot b{color:var(--ink)}
.list-empty{padding:40px;background:var(--tile);border-radius:var(--r);text-align:center}

/* calendario */
.cal{display:grid;grid-template-columns:1fr 340px;gap:14px}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.cal-head h2{margin:0;font-size:28px;text-transform:capitalize;font-weight:800;color:var(--ink)}
.cal-head div{display:flex;gap:6px}
.cal-head button{width:42px;height:42px;border-radius:50%;border:0;background:var(--paper);font-size:18px;cursor:pointer}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.grid7 .dn{font-size:12px;color:var(--mute);text-align:center;padding:6px 0;font-weight:600}
.day{aspect-ratio:1;border-radius:14px;display:flex;flex-direction:column;justify-content:space-between;padding:8px;font-weight:600;font-size:14px;background:var(--paper);border:0;text-align:left;min-width:0}
.day.out{background:none;color:#c9c4c4}
.day.ev{background:var(--red);color:#fff;cursor:pointer}
.day.ev.past{background:var(--graph)}
.day.ev small{font-size:11px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day.today{box-shadow:inset 0 0 0 2px var(--ink)}
.agenda h2{margin:0 0 10px}
.agenda button{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;width:100%;border:0;background:none;padding:10px 0;border-bottom:1px solid var(--line);text-align:left;cursor:pointer}
.agenda button b{font-size:22px;font-weight:800;text-align:center;line-height:1}
.agenda button b small{display:block;font-size:11px;color:var(--red)}
.agenda button span{font-weight:600}
.agenda button span small{display:block;color:var(--mute);font-weight:400}
@media (max-width:1100px){.cal{grid-template-columns:1fr}}

/* coach view */
.coachgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.ccard{padding:10px;cursor:pointer}
.ccard .pa-avatar{border-radius:20px;aspect-ratio:1}
.ccard h3{margin:12px 8px 0;font-size:20px;font-weight:800}
.ccard p{margin:2px 8px 6px;color:var(--mute);font-size:14px}
.ccard .st{display:flex;gap:6px;margin:8px;flex-wrap:wrap}
.ccard .st span{background:var(--paper);border-radius:10px;padding:5px 9px;font-size:12px}
.ccard .st span b{font-weight:800}

/* profilo */
.prof{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:1000px){.prof{grid-template-columns:1fr}}

/* mobile: tab bar in basso */
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;z-index:80;flex-direction:row;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:rgba(255,255,255,.9);backdrop-filter:blur(16px);border-top:1px solid var(--line);justify-content:space-around;gap:0}
  .side .logo,.side .bottom{display:none}
  .tab{flex-direction:column;gap:3px;font-size:11px;padding:6px 8px;width:auto;border-radius:12px}
  .tab[aria-current="page"]{background:none;color:var(--red)}
  main{padding:14px 12px 110px}
  .top{flex-wrap:wrap}
  .top .search{order:3;max-width:none;flex-basis:100%}
  .bento{grid-template-columns:1fr 1fr;gap:10px}
  .bento>.t{grid-column:span 2!important;grid-row:auto!important}
  .bento>.t.half{grid-column:span 1!important}
  .t{padding:18px;border-radius:22px}
  .hero-t{min-height:340px}
  .big-num{font-size:44px}
  .mlogo{display:block!important}
}
.mlogo{display:none;height:30px}
.backm{display:none}
@media (max-width:860px){.backm{display:inline-block;font-size:13px;color:var(--mute)}}
</style>
</head>
<body>
<div class="app">
  <nav class="side" aria-label="Sezioni app">
    <a class="logo" href="#" data-go="home"><img src="../assets/img/logo-dark.png" alt="Premium Academy"></a>
    <button class="tab" data-go="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
    <button class="tab" data-go="tappe"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Tappe</button>
    <button class="tab" data-go="calendario"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendario</button>
    <button class="tab" data-go="coach"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Coach</button>
    <button class="tab" data-go="profilo"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 8h3v3H8zM13 13h3v3h-3zM13 8h3M8 16h3"/></svg>Le mie iscrizioni</button>
    <div class="bottom">
      <div class="help"><b>Serve aiuto?</b>Alessandro risponde su WhatsApp<br><a href="https://wa.me/393337442984" target="_blank" rel="noopener">333 744 2984</a></div>
      <a class="back" href="../index.html">← Tutte le proposte</a>
    </div>
  </nav>

  <main>
    <div class="top">
      <img class="mlogo" src="../assets/img/mark.png" alt="Premium Academy">
      <h1 id="vtitle">Ciao, nuotatore</h1>
      <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" type="search" placeholder="Cerca una città o una piscina" aria-label="Cerca"></label>
      <a class="backm" href="../index.html">← Proposte</a>
      <button class="me" data-pa="account"><i>MR</i><span>Area</span></button>
    </div>

    <!-- HOME -->
    <section class="view" data-view="home">
      <div class="bento" id="bento"></div>
    </section>

    <!-- TAPPE -->
    <section class="view" data-view="tappe">
      <div class="filterbar">
        <div class="seg" id="segStatus"><button aria-pressed="true" data-s="">Tutte</button><button aria-pressed="false" data-s="open">Con posti</button><button aria-pressed="false" data-s="soldout">Sold out</button></div>
        <select id="fr" aria-label="Regione"><option value="">Tutte le regioni</option></select>
        <select id="fc" aria-label="Categoria"><option value="">Tutte le categorie</option></select>
        <select id="fm" aria-label="Mese"><option value="">Tutti i mesi</option></select>
      </div>
      <div class="cards" id="cards"></div>
    </section>

    <!-- CALENDARIO -->
    <section class="view" data-view="calendario">
      <div class="cal">
        <div class="t"><div class="cal-head"><h2 id="calm"></h2><div><button id="cprev" aria-label="Mese precedente">‹</button><button id="cnext" aria-label="Mese successivo">›</button></div></div><div class="grid7" id="grid7"></div></div>
        <div class="t agenda"><h2>Prossime tappe</h2><div id="agenda"></div></div>
      </div>
    </section>

    <!-- COACH -->
    <section class="view" data-view="coach"><div class="coachgrid" id="coachgrid"></div></section>

    <!-- PROFILO -->
    <section class="view" data-view="profilo">
      <div class="prof">
        <div class="t" id="myregs"></div>
        <div class="t"><h2>Domande frequenti</h2><div id="faq" style="margin-top:10px"></div></div>
      </div>
    </section>
  </main>
</div>

<script>window.PA_BASE='../'</script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/core.js"></script>
<script>
(function(){
  const {D,$,$$,esc,fmt,eur,cat,coach,eventInfo,filter,countdown,pad,italyMap,bindMap,avatar,photo,qr,faqHtml,bindFaq,store}=PA;
  const titles={home:'Ciao, nuotatore',tappe:'Tutte le tappe',calendario:'Calendario',coach:'I coach',profilo:'Le mie iscrizioni'};
  function go(v){
    $$('.view').forEach(s=>s.classList.toggle('is-on',s.dataset.view===v));
    $$('.tab').forEach(t=>t.dataset.go===v?t.setAttribute('aria-current','page'):t.removeAttribute('aria-current'));
    $('#vtitle').textContent=titles[v];scrollTo(0,0);
    if(v==='profilo')drawMine();
  }
  $$('[data-go]').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();go(b.dataset.go)}));
  $('#q').addEventListener('input',()=>{if(!$('[data-view="tappe"]').classList.contains('is-on'))go('tappe');drawCards()});

  /* HOME bento */
  const n=PA.nextOpen(),ni=eventInfo(n),regs=store.all(),mine=regs.find(r=>eventInfo(D.events.find(e=>e.id===r.eventId)).status!=='past');
  const tq=D.testimonials[1];
  const R=54,C=2*Math.PI*R,off=C*(1-ni.pct/100)*.75;
  $('#bento').innerHTML=`
    <article class="t red span-7 row-3 hero-t"><img class="mark" src="../assets/img/mark.png" alt="">
      <div><h2>Prossima tappa</h2><div class="city">${esc(n.city)}</div><div class="sub">${fmt.range(n)} · ${esc(n.venue)}</div><div class="cd" id="cd"></div></div>
      <div class="act"><button class="pa-btn" data-pa="register" data-id="${n.id}">Prenota una fascia</button><button class="pa-btn is-ghost" data-pa="event" data-id="${n.id}">Vedi programma</button></div></article>
    <article class="t span-5 row-1 link half gauge-h" data-pa="event" data-id="${n.id}"><h2>Posti occupati a ${esc(n.city)}</h2>
      <div class="gauge"><svg viewBox="0 0 140 110"><circle cx="70" cy="70" r="${R}" fill="none" stroke="#eeeaea" stroke-width="14" stroke-dasharray="${C*.75} ${C}" transform="rotate(135 70 70)" stroke-linecap="round"/><circle cx="70" cy="70" r="${R}" fill="none" stroke="#d70e20" stroke-width="14" stroke-dasharray="${C*.75-off} ${C}" transform="rotate(135 70 70)" stroke-linecap="round"/><text class="v" x="70" y="80" text-anchor="middle">${ni.pct}%</text></svg><p>${ni.left} posti liberi su ${ni.cap}</p></div></article>
    <article class="t photo-t span-5 row-2 link half" data-go-coach><img src="../assets/img/coaches-duo.jpg" alt="Calvi e Orsi"><div class="cap"><b>Calvi e Orsi</b><span>Head coach in tutte le tappe</span></div></article>
    <article class="t span-4 row-2"><h2>Trova la tua fascia</h2><div class="cats">${D.categories.map(c=>`<button data-cat="${c.id}">${esc(c.label)}<small>${esc(c.ages)}</small></button>`).join('')}</div></article>
    <article class="t dark span-4 row-2 ${mine?'mine':'steps-t'}">${mine?(()=>{const e=D.events.find(x=>x.id===mine.eventId);return `<h2>La tua prossima iscrizione</h2><div class="row">${qr(mine.code,90)}<div><b>${esc(e.city)}</b><span>${fmt.range(e)}<br>${mine.code}</span></div></div><button class="pa-btn is-sm" style="margin-top:16px" data-pa="account">Apri il pass</button>`})():`<h2>Come funziona</h2><ol>${D.steps.map(([t,p])=>`<li><div><b>${esc(t)}</b><span>${esc(p)}</span></div></li>`).join('')}</ol>`}</article>
    <article class="t span-4 row-2 mini-map"><h2>9 città, una mappa</h2><div id="mmap"></div></article>
    <article class="t span-3 half"><h2>Tappe in calendario</h2><div class="big-num">${PA.upcoming().length}</div></article>
    <article class="t span-3 half"><h2>Coach e ospiti</h2><div class="big-num">${D.coaches.length}</div></article>
    <article class="t span-6 quote-t"><h2>Dicono di noi</h2><p>“${esc(tq.text)}”</p><small>${esc(tq.name)}, ${esc(tq.who)}</small></article>
    <article class="t dark span-6 row-2"><h2>Per le società</h2><p style="font-size:24px;line-height:1.2;font-weight:700;margin:12px 0">Iscrivi tutta la squadra in un’unica pratica e usa il codice SOCIETA10.</p><p style="color:#b7b0b1">Report tecnico per ogni atleta e Clinic allenatori inclusa per un tecnico.</p><button class="pa-btn" data-pa="register">Iscrivi la società</button></article>
    <article class="t span-6 row-2 blog-t"><h2>Consigli dei coach</h2>${D.articles.map(a=>`<a href="#" onclick="PA.toast('Demo: articolo del blog');return false"><b>${esc(a.title)}</b><small>${esc(a.tag)} · ${a.min} min · ${esc(coach(a.coach).name)}</small></a>`).join('')}</article>
    <article class="t span-8 spons-t">${D.sponsors.map(s=>`<span>${esc(s)}</span>`).join('')}</article>
    <article class="t red span-4 news-t"><h2>Avvisami quando apre Cagliari</h2><form data-newsletter><input type="email" placeholder="Email" aria-label="Email"><button class="pa-btn is-sm" style="background:#1c1819;border-color:#1c1819">Avvisami</button></form></article>`;
  countdown(n.startDate,v=>$('#cd').innerHTML=`<div><b>${v.days}</b>giorni</div><div><b>${pad(v.hours)}</b>ore</div><div><b>${pad(v.minutes)}</b>min</div><div><b>${pad(v.seconds)}</b>sec</div>`);
  $('#mmap').innerHTML=italyMap({pinR:6});bindMap($('#mmap'));
  $('[data-go-coach]').onclick=()=>go('coach');
  $$('[data-cat]').forEach(b=>b.onclick=()=>{$('#fc').value=b.dataset.cat;go('tappe');drawCards()});

  /* TAPPE */
  let fstat='';
  PA.regions().forEach(r=>$('#fr').insertAdjacentHTML('beforeend',`<option>${esc(r)}</option>`));
  PA.months().forEach(m=>$('#fm').insertAdjacentHTML('beforeend',`<option value="${m.key}">${m.label}</option>`));
  D.categories.forEach(c=>$('#fc').insertAdjacentHTML('beforeend',`<option value="${c.id}">${esc(c.label)}</option>`));
  ['#fr','#fc','#fm'].forEach(s=>$(s).onchange=drawCards);
  $$('#segStatus button').forEach(b=>b.onclick=()=>{fstat=b.dataset.s;$$('#segStatus button').forEach(x=>x.setAttribute('aria-pressed',x===b));drawCards()});
  function drawCards(){
    let list=filter({q:$('#q').value,region:$('#fr').value,category:$('#fc').value,month:$('#fm').value});
    if(fstat==='open')list=list.filter(e=>['open','last'].includes(eventInfo(e).status));
    if(fstat==='soldout')list=list.filter(e=>eventInfo(e).status==='soldout');
    $('#cards').innerHTML=list.length?list.map(e=>{const s=eventInfo(e);return `<button class="t ecard link" data-pa="event" data-id="${e.id}">
      <div class="head"><div class="datebox"><small>${fmt.mon3(e.start)}</small><b>${e.startDate.getDate()}–${e.endDate.getDate()}</b></div><span class="pa-badge is-${s.status}">${esc(s.label)}</span></div>
      <div class="body"><h3>${esc(e.city)}</h3><p>${esc(e.venue)} · ${esc(e.pool)}</p>
      <div class="slotsmini" aria-label="Riempimento fasce">${e.slots.map(sl=>`<i title="${esc(cat(sl.cat).label)} ${sl.start}" style="--h:${Math.round((1-PA.slotLeft(sl)/sl.cap)*100)}%"></i>`).join('')}</div>
      <div class="foot"><span>${e.slots.length} fasce · ${e.coaches.length} coach</span><span>da <b>${eur(s.priceFrom)}</b></span></div></div></button>`}).join(''):`<div class="list-empty">Nessuna tappa con questi filtri.<br><button class="pa-link" id="clr">Mostra tutte le tappe</button></div>`;
    const c=$('#clr');if(c)c.onclick=()=>{['#q','#fr','#fc','#fm'].forEach(s=>$(s).value='');drawCards()};
  }
  drawCards();

  /* CALENDARIO */
  let cm=new Date(2026,9,1);
  function drawCal(){
    $('#calm').textContent=fmt.month(cm)+' '+cm.getFullYear();
    const first=(cm.getDay()+6)%7,days=new Date(cm.getFullYear(),cm.getMonth()+1,0).getDate();
    let h=['Lun','Mar','Mer','Gio','Ven','Sab','Dom'].map(d=>`<div class="dn">${d}</div>`).join('');
    for(let i=0;i<first;i++)h+=`<div class="day out"></div>`;
    for(let d=1;d<=days;d++){
      const iso=`${cm.getFullYear()}-${String(cm.getMonth()+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const ev=D.events.find(e=>e.slots.some(s=>s.date===iso));
      const today=iso==='2026-09-16';
      h+=ev?`<button class="day ev ${eventInfo(ev).status==='past'?'past':''} ${today?'today':''}" data-pa="event" data-id="${ev.id}"><span>${d}</span><small>${esc(ev.city)}</small></button>`:`<div class="day ${today?'today':''}">${d}</div>`;
    }
    $('#grid7').innerHTML=h;
  }
  $('#cprev').onclick=()=>{cm=new Date(cm.getFullYear(),cm.getMonth()-1,1);drawCal()};
  $('#cnext').onclick=()=>{cm=new Date(cm.getFullYear(),cm.getMonth()+1,1);drawCal()};
  drawCal();
  $('#agenda').innerHTML=PA.upcoming().map(e=>`<button data-pa="event" data-id="${e.id}"><b>${e.startDate.getDate()}<small>${fmt.mon3(e.start)}</small></b><span>${esc(e.city)}<small>${esc(eventInfo(e).label)}</small></span></button>`).join('');

  /* COACH */
  $('#coachgrid').innerHTML=D.coaches.map(c=>{const ev=PA.upcoming().find(e=>e.coaches.includes(c.id));return `<article class="t ccard link" data-pa="event" data-id="${ev?ev.id:n.id}" data-tab="coach">${avatar(c)}<h3>${esc(c.name)}</h3><p>${esc(c.focus)}</p><div class="st">${c.stats.map(([k,v])=>`<span>${esc(k)} <b>${esc(v)}</b></span>`).join('')}</div></article>`}).join('');

  /* PROFILO */
  function drawMine(){
    const rs=store.all();
    $('#myregs').innerHTML=`<h2>I tuoi pass</h2>`+(rs.length?rs.map(r=>{const e=D.events.find(x=>x.id===r.eventId);return `<div style="display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)">${qr(r.code,84)}<div><b style="font-size:20px">${esc(e.city)}</b><br><span style="color:var(--mute);font-size:14px">${fmt.range(e)} · ${esc(r.athlete)}<br>${r.code} · ${esc(r.status)}</span></div></div>`}).join(''):'<p>Nessuna iscrizione.</p>')+`<div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap"><button class="pa-btn" data-pa="account">Documenti e foto</button><button class="pa-btn is-ghost" data-pa="register">Nuova iscrizione</button></div>`;
  }
  $('#faq').innerHTML=faqHtml();bindFaq($('#faq'));
  document.addEventListener('pa:registered',()=>drawMine());

  const hv=location.hash.match(/v=(\w+)/);go(hv?hv[1]:'home');
})();
</script>
</body>
</html>
