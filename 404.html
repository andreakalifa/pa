<script>
/* GitHub Pages serve questa pagina per QUALSIASI indirizzo sbagliato, anche
   profondo. Senza una base, i percorsi relativi si romperebbero e la pagina
   arriverebbe senza stile. Qui la base si ricava dall'indirizzo: la radice
   del dominio, oppure la prima cartella se il sito sta in un repository. */
(function () {
  var seg = location.pathname.split('/').filter(Boolean);
  var base = (location.hostname.indexOf('github.io') > -1 && seg.length > 1) ? '/' + seg[0] + '/' : '/';
  document.write('<base href="' + base + '">');
})();
</script>
